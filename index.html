<html><head><title>SeatFlow</title></head><body><div id="root"></div><script>window.addEventListener('error',function(event){var image=event.target;if(image&&image.tagName==='IMG'&&!image.dataset.fallback){image.dataset.fallback='true';image.src='/poster-fallback.svg'}},true);document.addEventListener('click',function(event){var button=event.target.closest('.chips button');if(!button)return;var category=button.textContent.trim();document.querySelectorAll('.chips button').forEach(function(item){item.style.background=item===button?'#eee':'';item.style.color=item===button?'#111':''});document.querySelectorAll('.grid article').forEach(function(card){var label=card.querySelector('.poster span');card.style.display=category==='ALL'||(label&&label.textContent.trim()===category)?'':'none'})})</script><script type="module" src="/src/main.jsx"></script></body></html>

<html><head><title>SeatFlow</title></head><body><div id="root"></div><script>window.addEventListener('error',function(event){var image=event.target;if(image&&image.tagName==='IMG'&&!image.dataset.fallback){image.dataset.fallback='true';image.src='/poster-fallback.svg'}},true);function enhanceBrowse(){var chips=document.querySelector('.chips');if(!chips||chips.dataset.enhanced)return;chips.dataset.enhanced='true';['ANIME','EVENTS','TOP RATED'].forEach(function(name){var button=document.createElement('button');button.textContent=name;chips.appendChild(button)});chips.addEventListener('click',function(event){var button=event.target.closest('button');if(!button)return;var category=button.textContent.trim();chips.querySelectorAll('button').forEach(function(item){item.style.background=item===button?'#eee':'';item.style.color=item===button?'#111':''});document.querySelectorAll('.grid article').forEach(function(card){var label=card.querySelector('.poster span'),rating=card.querySelector('.poster b'),matchesTop=rating&&parseFloat(rating.textContent.replace(/[^0-9.]/g,''))>=9;card.style.display=category==='ALL'||(category==='TOP RATED'?matchesTop:label&&label.textContent.trim()===category)?'':'none'})})}new MutationObserver(enhanceBrowse).observe(document.body,{childList:true,subtree:true});</script><script type="module" src="/src/main.jsx"></script></body></html>
